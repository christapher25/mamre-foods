name: Android

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      # gradlew is committed without the executable bit (created on Windows).
      - run: chmod +x gradlew
      - name: Unit tests
        run: ./gradlew test
